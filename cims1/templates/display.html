<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course_type }} Analysis</title>
</head>
<body>
    <h1>{{ course_type }} Analysis</h1>
    <h2>Admitted Students</h2>
    <img src="data:image/png;base64,{{ admitted_img }}" alt="Admitted Students">
    
    <h2>Vacant Seats</h2>
    <img src="data:image/png;base64,{{ vacant_img }}" alt="Vacant Seats">
    
    <h2>Admissions per Course</h2>
    <img src="data:image/png;base64,{{ course_img }}" alt="Admissions per Course">
</body>
</html>
